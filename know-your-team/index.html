<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>KnowYourTeam</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="top-bar">
      <div class="top-bar-left">
        <a href="../index.html" class="home-btn" title="Back to Dashboard" aria-label="Back to Dashboard">🏠</a>
        <span class="app-logo">⚽</span>
        <span class="app-title">KnowYourTeam</span>
      </div>
      <div class="top-bar-right">
        <button class="nav-btn" id="quiz-nav-btn" aria-label="Open Quiz Mode" title="Quiz Mode">🧠</button>
        <button class="nav-btn" id="compare-nav-btn" aria-label="Compare Teams" title="Compare Teams">⚖️</button>
        <button class="filter-btn" id="filter-btn" aria-label="Filter by league">
          <span class="filter-icon">🏆</span>
          <span class="filter-label" id="filter-label">All Leagues</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Search / Browse View -->
      <section id="view-browse" class="view active">
        <div class="search-wrap">
          <input type="text" id="search-input" class="search-input" placeholder="Search teams, players, legends, grounds..." autocomplete="off" aria-label="Search for a team, player, or legend" />
        </div>
        <div class="browse-actions">
          <button class="action-chip" id="random-btn" aria-label="Show random team">🎲 Surprise Me</button>
          <button class="action-chip" id="fav-filter-btn" aria-label="Show favourite team">⭐ My Team</button>
        </div>
        <div id="league-filter" class="league-filter hidden">
          <button class="league-chip active" data-league="all">All</button>
          <button class="league-chip" data-league="Premier League">Premier League</button>
          <button class="league-chip" data-league="Championship">Championship</button>
          <button class="league-chip" data-league="League One">League One</button>
          <button class="league-chip" data-league="League Two">League Two</button>
          <button class="league-chip" data-league="National League">National League</button>
        </div>
        <div id="team-list" class="team-list" role="list"></div>
        <div class="data-updated" id="data-updated">Data: 2024/25 season</div>
      </section>

      <!-- Team Detail View -->
      <section id="view-team" class="view">
        <button class="back-btn" id="back-btn" aria-label="Go back to team list">← Back</button>
        <div id="team-detail"></div>
      </section>

      <!-- Compare View -->
      <section id="view-compare" class="view">
        <button class="back-btn" id="compare-back-btn" aria-label="Go back to team list">← Back</button>
        <h2 class="view-title">Compare Teams</h2>
        <div class="compare-selectors">
          <select id="compare-team-a" class="compare-select" aria-label="Select first team"></select>
          <span class="compare-vs">VS</span>
          <select id="compare-team-b" class="compare-select" aria-label="Select second team"></select>
        </div>
        <div id="compare-result" class="compare-result"></div>
      </section>

      <!-- Quiz View -->
      <section id="view-quiz" class="view">
        <button class="back-btn" id="quiz-back-btn" aria-label="Go back to team list">← Back</button>
        <h2 class="view-title">Quiz Mode</h2>
        <div class="quiz-modes">
          <button class="quiz-mode-btn" data-mode="nickname" aria-label="Guess the team from nickname">🏷️ Guess the Nickname</button>
          <button class="quiz-mode-btn" data-mode="ground" aria-label="Guess the team from ground">🏟️ Guess the Ground</button>
          <button class="quiz-mode-btn" data-mode="player" aria-label="Guess the team from player">👤 Guess the Player's Team</button>
          <button class="quiz-mode-btn" data-mode="legend" aria-label="Guess the team from legend">⭐ Guess the Legend's Club</button>
          <button class="quiz-mode-btn" data-mode="year" aria-label="Guess when team was founded">📅 Guess Founded Year</button>
        </div>
        <div id="quiz-area" class="quiz-area hidden">
          <div class="quiz-score" id="quiz-score">0 / 0</div>
          <div class="quiz-question" id="quiz-question"></div>
          <div class="quiz-options" id="quiz-options" role="group" aria-label="Answer choices"></div>
          <div class="quiz-feedback" id="quiz-feedback"></div>
          <button class="quiz-next-btn hidden" id="quiz-next-btn">Next Question →</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../firebase-sync.js"></script>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
