<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawk Analytics - Cross-App Insights</title>
  <meta name="theme-color" content="#667eea" />
  <link rel="stylesheet" href="shared/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --accent-primary: #667eea;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .header {
      background: linear-gradient(135deg, var(--accent-primary) 0%, #764ba2 100%);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
      margin-bottom: 2rem;
    }

    .analytics-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-bottom: 16px;
    }

    .insight-list {
      list-style: none;
    }

    .insight-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .insight-item:last-child {
      border-bottom: none;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }

    .metric-item {
      text-align: center;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .trend-indicator {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-left: 8px;
    }

    .trend-up {
      background: #dcfce7;
      color: #166534;
    }

    .trend-down {
      background: #fef2f2;
      color: #dc2626;
    }

    .prediction-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .prediction-title {
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .prediction-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .prediction-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
    }

    .prediction-tracker {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .prediction-details {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .analytics-grid {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 1.8rem;
      }
      
      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Hawk Analytics</h1>
    <p>Advanced insights across all your tracking apps</p>
  </div>

  <div class="container">
    <!-- AI Predictions -->
    <div class="prediction-card">
      <div class="prediction-title">🔮 AI Predictions</div>
      <div class="prediction-grid" id="predictions-grid"></div>
    </div>

    <!-- Analytics Grid -->
    <div class="analytics-grid">
      <!-- Activity Overview -->
      <div class="analytics-card">
        <div class="card-title">📈 Activity Overview</div>
        <div class="metric-grid" id="activity-metrics"></div>
        <div class="chart-container">
          <canvas id="activity-chart"></canvas>
        </div>
      </div>

      <!-- Tracker Usage -->
      <div class="analytics-card">
        <div class="card-title">📱 Tracker Usage Distribution</div>
        <div class="chart-container">
          <canvas id="usage-chart"></canvas>
        </div>
        <ul class="insight-list" id="usage-insights"></ul>
      </div>

      <!-- Temporal Patterns -->
      <div class="analytics-card">
        <div class="card-title">⏰ Temporal Patterns</div>
        <div class="chart-container">
          <canvas id="temporal-chart"></canvas>
        </div>
        <ul class="insight-list" id="temporal-insights"></ul>
      </div>

      <!-- Cross-App Correlations -->
      <div class="analytics-card">
        <div class="card-title">🔗 Cross-App Insights</div>
        <div class="metric-grid" id="correlation-metrics"></div>
        <ul class="insight-list" id="correlation-insights"></ul>
      </div>

      <!-- Progress Analytics -->
      <div class="analytics-card">
        <div class="card-title">🎯 Progress Analytics</div>
        <div class="chart-container">
          <canvas id="progress-chart"></canvas>
        </div>
        <ul class="insight-list" id="progress-insights"></ul>
      </div>

      <!-- Location Insights -->
      <div class="analytics-card">
        <div class="card-title">📍 Location Insights</div>
        <div class="metric-grid" id="location-metrics"></div>
        <ul class="insight-list" id="location-insights"></ul>
      </div>
    </div>

    <!-- Back to Hawk Central -->
    <div style="text-align: center; margin-top: 2rem;">
      <button onclick="window.location.href='hawk-central.html'" 
              style="padding: 12px 24px; background: var(--accent-primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;">
        🦅 Back to Hawk Central
      </button>
    </div>
  </div>

  <!-- Hawk Central Integration -->
  <div class="hawk-central-nav">
    <button class="hawk-central-button" onclick="window.location.href='hawk-central.html'" title="Back to Hawk Central">
      🦅
    </button>
  </div>

  <script src="shared/services.js"></script>
  <script src="shared/ai-insights.js"></script>
  <script src="analytics-dashboard.js"></script>
</body>
</html>
