<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubology Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #0f1117; color: #f0f2f5; }
        .debug { background: #1a1d2e; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .error { color: #ff6b6b; }
        .success { color: #4ecdc4; }
        .warning { color: #ffe66d; }
    </style>
</head>
<body>
    <h1>🚇 Tubology Debug Console</h1>
    <div id="debug-output"></div>
    
    <script>
        const debug = document.getElementById('debug-output');
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `debug ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debug.appendChild(div);
            console.log(message);
        }
        
        log('🔍 Starting Tubology diagnostics...');
        
        // Test if basic elements exist
        setTimeout(() => {
            log('📋 Checking HTML elements...');
            
            const stationList = document.getElementById('station-list');
            log(stationList ? '✅ station-list found' : '❌ station-list NOT found', stationList ? 'success' : 'error');
            
            const headerStats = document.getElementById('stat-visited');
            log(headerStats ? '✅ stat-visited found' : '❌ stat-visited NOT found', headerStats ? 'success' : 'error');
            
            const searchInput = document.getElementById('search');
            log(searchInput ? '✅ search input found' : '❌ search input NOT found', searchInput ? 'success' : 'error');
            
        }, 100);
    </script>
    
    <!-- Load data files -->
    <script>
        log('📦 Loading data.js...');
    </script>
    <script src="data.js"></script>
    <script>
        log(typeof TUBE_LINES !== 'undefined' ? '✅ TUBE_LINES loaded' : '❌ TUBE_LINES failed', 
            typeof TUBE_LINES !== 'undefined' ? 'success' : 'error');
        log(typeof STATION_INDEX !== 'undefined' ? '✅ STATION_INDEX loaded' : '❌ STATION_INDEX failed',
            typeof STATION_INDEX !== 'undefined' ? 'success' : 'error');
    </script>
    
    <script>
        log('📦 Loading zones.js...');
    </script>
    <script src="zones.js"></script>
    <script>
        log(typeof STATION_ZONES !== 'undefined' ? '✅ STATION_ZONES loaded' : '❌ STATION_ZONES failed',
            typeof STATION_ZONES !== 'undefined' ? 'success' : 'error');
    </script>
    
    <script>
        log('📦 Loading app.js...');
    </script>
    <script src="app.js"></script>
    <script>
        log(typeof visited !== 'undefined' ? '✅ visited variable exists' : '❌ visited variable missing',
            typeof visited !== 'undefined' ? 'success' : 'error');
        log(typeof updateFilteredStations === 'function' ? '✅ updateFilteredStations function exists' : '❌ updateFilteredStations missing',
            typeof updateFilteredStations === 'function' ? 'success' : 'error');
        log(typeof renderVirtualList === 'function' ? '✅ renderVirtualList function exists' : '❌ renderVirtualList missing',
            typeof renderVirtualList === 'function' ? 'success' : 'error');
        
        // Check if DOMContentLoaded fired
        if (document.readyState === 'complete') {
            log('✅ Document is ready', 'success');
        } else {
            log('⏳ Document still loading...', 'warning');
        }
        
        // Test data integrity
        if (typeof TUBE_ONLY_STATIONS !== 'undefined') {
            log(`📊 Found ${TUBE_ONLY_STATIONS.length} tube stations`, 'success');
        }
        if (typeof OVERGROUND_STATIONS !== 'undefined') {
            log(`📊 Found ${OVERGROUND_STATIONS.length} overground stations`, 'success');
        }
        
        // Listen for any JavaScript errors
        window.addEventListener('error', (e) => {
            log(`💥 JavaScript Error: ${e.message} at line ${e.lineno}`, 'error');
        });
        
        // Test initialization manually
        setTimeout(() => {
            log('🧪 Testing manual initialization...', 'warning');
            try {
                if (typeof updateHeaderStats === 'function') {
                    updateHeaderStats();
                    log('✅ updateHeaderStats ran successfully', 'success');
                } else {
                    log('❌ updateHeaderStats function missing', 'error');
                }
                
                if (typeof updateFilteredStations === 'function') {
                    updateFilteredStations();
                    log('✅ updateFilteredStations ran successfully', 'success');
                } else {
                    log('❌ updateFilteredStations function missing', 'error');
                }
            } catch (error) {
                log(`💥 Error during manual test: ${error.message}`, 'error');
            }
        }, 1000);
    </script>
</body>
</html>
