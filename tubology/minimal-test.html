<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubology Minimal Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #f0f2f5;
            padding: 20px;
        }
        .header {
            background: #1a1d2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .stat-pill {
            padding: 8px 12px;
            background: #22263a;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .progress-bar {
            height: 4px;
            background: #0098D4;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .station-list {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚇 Tubology Minimal Test</h1>
        <div class="stats">
            <div class="stat-pill" id="stat-visited">0 Visited</div>
            <div class="stat-pill" id="stat-remaining">0 Remaining</div>
            <div style="width: 100px; background: #333; border-radius: 2px;">
                <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
            </div>
            <span id="progress-pct">0%</span>
        </div>
    </div>
    
    <div id="station-list" class="station-list">
        <p>Loading stations...</p>
    </div>
    
    <!-- Load scripts -->
    <script src="data.js"></script>
    <script src="zones.js"></script>
    <script src="minimal-app.js"></script>
</body>
</html>
