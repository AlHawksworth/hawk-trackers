<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tubology</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="Track your London Underground station visits" />
</head>
<body>

<header>
  <div class="header-inner">
    <h1>🚇 Tubology</h1>
    <div class="header-stats" aria-live="polite">
      <div class="stat-pill visited" id="stat-visited">0 Visited</div>
      <div class="stat-pill remaining" id="stat-remaining">0 Remaining</div>
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <span id="progress-pct">0%</span>
    </div>
    <a href="../index.html" class="home-btn" title="Back to My Trackers">⌂</a>
  </div>
  <div class="last-updated" id="last-updated">Last updated: Never</div>
  <nav class="page-tabs" role="tablist" aria-label="App sections">
    <button class="page-tab active" data-page="tracker" role="tab" aria-selected="true">🚇 Tracker</button>
    <button class="page-tab" data-page="overground" role="tab" aria-selected="false">🚈 Overground</button>
  </nav>
</header>

<!-- TRACKER PAGE -->
<div id="page-tracker" class="page active">
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search stations or lines…" aria-label="Search tube stations or lines" />
    <div class="filter-group" id="status-filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="visited">Visited</button>
      <button class="filter-btn" data-filter="unvisited">Not Visited</button>
    </div>
    <div class="filter-group" id="sort-group">
      <button class="filter-btn active" data-sort="alpha">A-Z</button>
      <button class="filter-btn" data-sort="line">By Line</button>
      <button class="filter-btn" data-sort="zone">By Zone</button>
    </div>
    <div class="filter-group" id="zone-filter-group"></div>
    <div class="filter-group" id="line-filter-group"></div>
  </div>
  <div id="station-list" class="station-list"></div>
</div>

<!-- OVERGROUND PAGE -->
<div id="page-overground" class="page">
  <div class="overground-header">
    <div class="overground-stats">
      <div class="stat-pill visited" id="og-stat-visited">0 Visited</div>
      <div class="stat-pill remaining" id="og-stat-remaining">0 Remaining</div>
      <div class="progress-wrap"><div class="progress-bar" id="og-progress-bar"></div></div>
      <span id="og-progress-pct">0%</span>
    </div>
  </div>
  <div class="toolbar">
    <input type="text" id="og-search" placeholder="Search overground stations…" aria-label="Search overground stations" />
    <div class="filter-group">
      <button class="filter-btn active" data-og-filter="all">All</button>
      <button class="filter-btn" data-og-filter="visited">Visited</button>
      <button class="filter-btn" data-og-filter="unvisited">Not Visited</button>
    </div>
    <div class="filter-group" id="og-line-filter-group"></div>
  </div>
  <div class="station-count" id="og-station-count"></div>
  <div id="og-station-list" class="station-list"></div>
</div>

<!-- Load only essential scripts -->
<script src="data.js"></script>
<script src="zones.js"></script>
<script src="app.js"></script>

<script>
  console.log('🔧 Simple index.html loaded');
</script>

</body>
</html>
