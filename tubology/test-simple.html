<!DOCTYPE html>
<html>
<head>
    <title>Tubology Test</title>
</head>
<body>
    <h1>Tubology App Functionality Test</h1>
    <div id="test-output"></div>
    <script src="data.js"></script>
    <script src="zones.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const output = document.getElementById('test-output');
            
            // Test data loading
            if (typeof TUBE_LINES !== 'undefined') {
                output.innerHTML += '<p>✅ TUBE_LINES loaded: ' + Object.keys(TUBE_LINES).length + ' lines</p>';
            } else {
                output.innerHTML += '<p>❌ TUBE_LINES not loaded</p>';
            }
            
            if (typeof STATION_INDEX !== 'undefined') {
                output.innerHTML += '<p>✅ STATION_INDEX loaded: ' + Object.keys(STATION_INDEX).length + ' stations</p>';
            } else {
                output.innerHTML += '<p>❌ STATION_INDEX not loaded</p>';
            }
            
            if (typeof STATION_ZONES !== 'undefined') {
                output.innerHTML += '<p>✅ STATION_ZONES loaded: ' + Object.keys(STATION_ZONES).length + ' zones</p>';
            } else {
                output.innerHTML += '<p>❌ STATION_ZONES not loaded</p>';
            }
            
            if (typeof ALL_STATIONS !== 'undefined') {
                output.innerHTML += '<p>✅ ALL_STATIONS loaded: ' + ALL_STATIONS.length + ' stations</p>';
                output.innerHTML += '<p>Sample stations: ' + ALL_STATIONS.slice(0, 5).join(', ') + '...</p>';
            } else {
                output.innerHTML += '<p>❌ ALL_STATIONS not loaded</p>';
            }
            
            if (typeof TUBE_ONLY_STATIONS !== 'undefined') {
                output.innerHTML += '<p>✅ TUBE_ONLY_STATIONS loaded: ' + TUBE_ONLY_STATIONS.length + ' stations</p>';
            } else {
                output.innerHTML += '<p>❌ TUBE_ONLY_STATIONS not loaded</p>';
            }
        });
    </script>
</body>
</html>
