<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawk Central - Your Tracking Dashboard</title>
  <meta name="theme-color" content="#667eea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest-central.json" />
  <link rel="stylesheet" href="shared/styles.css" />
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --accent-primary: #667eea;
      --accent-secondary: #764ba2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .header {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="1.5" fill="rgba(255,255,255,0.1)"/></svg>');
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100px); }
    }

    .header-content {
      position: relative;
      z-index: 2;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>🦅 Hawk Central</h1>
      <p>Your unified tracking dashboard</p>
    </div>
  </div>

  <div class="container">
    <!-- Overview Stats -->
    <div class="section">
      <h2 class="section-title">📊 Overview</h2>
      <div class="hawk-stats-grid" id="overview-stats"></div>
    </div>

    <!-- Quick Actions -->
    <div class="section">
      <h2 class="section-title">⚡ Quick Actions</h2>
      <div class="hawk-quick-actions" id="quick-actions"></div>
    </div>

    <!-- Recent Activity -->
    <div class="section">
      <h2 class="section-title">📱 Recent Activity</h2>
      <div class="hawk-activity-feed" id="activity-feed"></div>
    </div>
    <!-- Tracker Grid -->
    <div class="section">
      <h2 class="section-title">📱 Your Trackers</h2>
      <div id="trackers-grid" class="trackers-grid"></div>
    </div>

    <!-- Recommendations -->
    <div class="section">
      <h2 class="section-title">💡 Recommendations</h2>
      <div id="recommendations" class="recommendations-list"></div>
    </div>

    <!-- Achievements -->
    <div class="section">
      <h2 class="section-title">🏆 Recent Achievements</h2>
      <div id="achievements" class="achievements-grid"></div>
    </div>
  </div>

  <!-- Unified Search Modal -->
  <div class="hawk-unified-search" id="unified-search">
    <div class="hawk-search-container">
      <div class="hawk-search-header">
        <input type="text" class="hawk-search-input" placeholder="Search across all trackers..." id="search-input" />
      </div>
      <div class="hawk-search-results" id="search-results"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="shared/services.js"></script>
  <script src="hawk-central.js"></script>

  <style>
    .trackers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .tracker-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .tracker-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--tracker-color, var(--accent-primary));
    }

    .tracker-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      border-color: var(--tracker-color, var(--accent-primary));
    }

    .tracker-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .tracker-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      margin-right: 12px;
      background: var(--tracker-color, var(--accent-primary));
    }

    .tracker-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tracker-stats {
      margin: 12px 0;
    }

    .tracker-stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .tracker-stat-label {
      color: var(--text-secondary);
    }

    .tracker-stat-value {
      font-weight: 500;
      color: var(--text-primary);
    }

    .tracker-last-used {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .recommendations-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .recommendation-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .recommendation-card:hover {
      border-color: var(--accent-primary);
      background: var(--bg-hover);
    }

    .recommendation-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: var(--accent-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .recommendation-content {
      flex: 1;
    }

    .recommendation-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .recommendation-message {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .achievement-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .achievement-badge-large {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, #ffd700 0%, #ffed4a 100%);
      color: #333;
    }

    .achievement-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .achievement-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .header p {
        font-size: 1rem;
      }
      
      .container {
        padding: 1rem;
      }
      
      .trackers-grid {
        grid-template-columns: 1fr;
      }
      
      .recommendations-list {
        gap: 8px;
      }
      
      .achievements-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</body>
</html>
